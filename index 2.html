<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HA-Liste</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HA-Liste">
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2430;--mute:#66707c;--line:#dde2e8;--pri:#1f5f8b;--pri-ink:#fff;--warn:#c98a00;--warn-bg:#fff4d6;--bad:#d64545;--ok:#2e8b57}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1c222a;--ink:#e8edf2;--mute:#9aa4af;--line:#2c343e;--pri:#2f74a6;--pri-ink:#fff;--warn:#f0b93a;--warn-bg:#3a3020;--bad:#ff7a7a;--ok:#5fcf8f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:5}
header{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:var(--pri);color:var(--pri-ink)}
header h1{flex:1;margin:0 4px;font-size:19px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;color:inherit;font-size:26px;min-width:44px;min-height:44px;cursor:pointer;line-height:1}
.iconbtn:disabled{opacity:.3}
.iconbtn.sm{font-size:24px;color:var(--pri);border:1px solid var(--line);background:var(--card);border-radius:10px}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav[hidden]{display:none}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mute);font-size:15px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{padding:16px 16px calc(env(safe-area-inset-bottom) + 32px);max-width:1100px;margin:0 auto}
h2{font-size:17px;margin:24px 0 10px}
h4{font-size:15px;margin:20px 0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.cname{font-size:24px;font-weight:700}
.cmeta{color:var(--mute);font-size:14px}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;min-height:36px;font-size:14px}
.wide{width:100%}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ctrl .grow,.grow{flex:1;min-width:0}
.ctrl select.grow{min-width:140px}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px;max-width:100%}
textarea{width:100%;min-height:150px}
.hint{color:var(--mute);font-size:14px;margin:4px 0 12px}
.muted{color:var(--mute);font-size:14px}
/* Kategorien */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;flex:1;min-width:0}
.chip{flex:none;border:2px solid var(--c);color:var(--c);background:var(--card);border-radius:22px;padding:8px 14px;font:inherit;font-weight:650;white-space:nowrap;cursor:pointer;min-height:44px}
.chip.on{background:var(--c);color:#fff}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);color:var(--mute);font:inherit;font-size:14px;font-weight:600;padding:0 14px;min-height:44px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
/* Schülerkacheln */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stu{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;min-height:80px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:left;font:inherit;cursor:pointer;user-select:none;-webkit-user-select:none;width:100%}
.stu .sn{font-weight:600;line-height:1.2;padding-right:26px;word-break:break-word}
.stu .tags{display:flex;flex-wrap:wrap;gap:3px;min-height:18px}
.stu .tot{position:absolute;top:8px;right:9px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.stu.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card))}
.summary{margin:14px 0 0;color:var(--mute);font-size:14px}
.stu.bt{cursor:default}
.stars{display:flex;width:100%;margin:-2px 0}
.star{flex:1;min-width:0;border:0;background:none;font-size:26px;line-height:1;padding:4px 0;color:var(--line);cursor:pointer}
.star.on{color:#f0a800}
.seats .star{font-size:20px}
.nivbtn{flex:none;min-width:52px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.nivbtn.own{border-color:var(--pri);color:var(--pri)}
.keytab input{width:90px;min-height:40px;text-align:center}
.keytab td,.keytab th{padding:6px 8px}
/* Sitzplan */
.scrollx{overflow-x:auto;padding-bottom:4px}
.seats{display:grid;grid-template-columns:repeat(var(--cols),minmax(96px,1fr));gap:8px}
.seats .stu{min-height:70px;padding:8px 9px}
.seats .stu .sn{font-size:15px}
.seat-empty{min-height:70px;border-radius:12px;border:1px dashed var(--line);opacity:.5}
.pult{text-align:center;padding:6px;border:1px dashed var(--mute);border-radius:8px;color:var(--mute);font-size:13px;margin:10px auto;max-width:260px}
.ecell{min-height:62px;border-radius:10px;border:2px dashed var(--line);background:var(--card);color:var(--mute);font:inherit;font-size:14px;cursor:pointer;padding:6px;word-break:break-word}
.ecell.has{border-style:solid;color:var(--ink);font-weight:600}
.ecell.sel,.schip.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 18%,var(--card));color:var(--ink)}
.schips{display:flex;flex-wrap:wrap;gap:8px}
.schip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
/* Tabelle */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
.tablewrap{overflow-x:auto;border-radius:12px}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mute);font-weight:700;vertical-align:bottom}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums;min-width:52px}
tr.row{cursor:pointer}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle}
.dot.g{background:var(--ok)}.dot.y{background:var(--warn)}.dot.r{background:var(--bad)}
tr.detail td{background:var(--bg);font-size:14px;color:var(--mute);padding:8px 14px}
tr.detail ul{margin:0;padding-left:18px}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.note{background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note span{flex:1;min-width:180px}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li span{flex:1}
.li .iconbtn{font-size:18px;color:var(--mute);min-width:40px;min-height:40px}
.li.cat{padding-left:8px}
.li.cat select{padding:9px 6px}
.swatch{flex:none;width:36px;height:36px;border-radius:50%;border:3px solid var(--card);outline:2px solid var(--c);background:var(--c);cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:14px;color:var(--mute)}
.row2{display:flex;gap:12px;flex-wrap:wrap}.row2>.field{flex:1;min-width:120px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.check{display:flex;align-items:center;gap:8px;font-size:15px;min-height:44px}
.check input{width:22px;height:22px;min-height:0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:16px;padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 6px}
</style>
</head>
<body>
<div class="top">
  <header>
    <button id="back" class="iconbtn" aria-label="Zurück" hidden>‹</button>
    <h1 id="title">HA-Liste</h1>
    <button id="menu" class="iconbtn" aria-label="Einstellungen">⚙︎</button>
  </header>
  <nav id="tabs" hidden>
    <button data-tab="erfassen">Erfassen</button>
    <button data-tab="uebersicht">Übersicht</button>
    <button data-tab="verwalten">Klasse</button>
  </nav>
</div>
<main id="view"></main>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
const KEY = 'ha-liste-v1';
const COLORS = ['#d64545', '#e0a100', '#1f77b4', '#2e8b57', '#8e44ad', '#e67e22', '#16a085', '#c2185b', '#7f8c8d'];
const $ = s => document.querySelector(s);
const main = $('#view');
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const fmt = iso => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
const wd = iso => ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][new Date(iso + 'T12:00').getDay()];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byName = (a, b) => a.name.localeCompare(b.name, 'de');
const num = n => String(n).replace('.', ',');
function shortName(n) {
  if (n.includes(',')) { const [nach, vor] = n.split(',').map(s => s.trim()); return vor ? `${vor} ${nach.charAt(0)}.` : nach; }
  return n;
}

/* ---------- Speicher ---------- */
function defaultCats(halb) {
  return [
    { id: 'f', name: 'HA fehlt', color: COLORS[0], w: 1, grp: 'ha' },
    { id: 'u', name: 'HA unvollständig', color: COLORS[1], w: halb ?? 0.5, grp: 'ha' }
  ];
}
const NIV = { msa: 'MSA', ue: 'Ü' };
// Mindest-Durchschnitt (Sterne 1–5) für die Noten 1–5, darunter 6
const defaultScales = () => ({ msa: [4.5, 3.8, 3.0, 2.2, 1.5], ue: [4.7, 4.2, 3.5, 2.7, 1.8] });
function fresh() { return { v: 3, settings: { gelb: 2, rot: 3 }, scales: defaultScales(), cats: defaultCats(), classes: [], entries: {}, beitr: {}, lastBackup: null }; }
function normalize(s) {
  if (!s || !Array.isArray(s.classes)) return null;
  const n = fresh();
  n.settings.gelb = +(s.settings && s.settings.gelb) || 2;
  n.settings.rot = +(s.settings && s.settings.rot) || 3;
  n.cats = (Array.isArray(s.cats) && s.cats.length)
    ? s.cats.map(k => ({ id: String(k.id || uid()), name: String(k.name || 'Kategorie'), color: k.color || COLORS[2], w: +k.w || 0, grp: k.grp || k.id }))
    : defaultCats(s.settings && s.settings.halb !== undefined ? +s.settings.halb : 0.5);
  const sc = s.scales || {};
  ['msa', 'ue'].forEach(k => { if (Array.isArray(sc[k]) && sc[k].length === 5) n.scales[k] = sc[k].map(Number); });
  const B = s.beitr || {};
  for (const cid in B) {
    n.beitr[cid] = {};
    for (const k in B[cid]) {
      const day = {};
      for (const sid in B[cid][k]) { const v = +B[cid][k][sid]; if (v >= 1 && v <= 5) day[sid] = v; }
      if (Object.keys(day).length) n.beitr[cid][k] = day;
    }
  }
  n.classes = s.classes.map(c => {
    const students = (c.students || []).map(st => { const o = { id: st.id || uid(), name: String(st.name) }; if (NIV[st.niv]) o.niv = st.niv; return o; });
    const ids = new Set(students.map(x => x.id));
    const se = c.seats || {};
    const map = {};
    for (const k in (se.map || {})) if (ids.has(se.map[k])) map[k] = se.map[k];
    return {
      id: c.id || uid(), name: String(c.name || 'Klasse'),
      subjects: (c.subjects && c.subjects.length) ? c.subjects.map(String) : ['Mathe'],
      lastSubj: c.lastSubj || null, students, view: c.view === 'seat' ? 'seat' : 'list', niveau: NIV[c.niveau] ? c.niveau : 'msa',
      seats: { rows: +se.rows || 5, cols: +se.cols || 6, flip: !!se.flip, map }
    };
  });
  const E = s.entries || {};
  for (const cid in E) {
    n.entries[cid] = {};
    for (const k in E[cid]) {
      const day = {};
      for (const sid in E[cid][k]) {
        const v = E[cid][k][sid];
        const arr = Array.isArray(v) ? v.map(String) : (v ? [String(v)] : []);
        if (arr.length) day[sid] = arr;
      }
      if (Object.keys(day).length) n.entries[cid][k] = day;
    }
  }
  n.lastBackup = s.lastBackup || null;
  return n;
}
function load() {
  try { const r = localStorage.getItem(KEY); if (r) { const n = normalize(JSON.parse(r)); if (n) return n; } } catch (e) { }
  return fresh();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ Speichern fehlgeschlagen'); }
}
save();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });

/* ---------- UI-Zustand ---------- */
let ui = { screen: 'home', cid: null, tab: 'erfassen', date: today(), subj: null, cat: null, ovSubj: '*', ovRange: 'hj', ovCat: '*', ovMode: 'cat', detail: null, pick: null };
const cls = () => S.classes.find(c => c.id === ui.cid);
const catById = id => S.cats.find(k => k.id === id);
const effNiv = (c, s) => s.niv || c.niveau;
function grade(avg, niv) { const t = S.scales[niv]; for (let i = 0; i < 5; i++) if (avg >= t[i] - 1e-9) return i + 1; return 6; }
const avgFmt = x => num(Math.round(x * 10) / 10);
const starStr = n => '★'.repeat(n) + '☆'.repeat(5 - n);
function curSubj(c) { let s = ui.subj || c.lastSubj; if (!c.subjects.includes(s)) s = c.subjects[0]; return s; }
function curCat() { return catById(ui.cat) || S.cats[0]; }

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }

function render() {
  const c = cls();
  if (ui.screen === 'class' && c) {
    $('#title').textContent = c.name;
    $('#back').hidden = false;
    $('#tabs').hidden = false;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
    if (ui.tab === 'erfassen') renderErfassen(c);
    else if (ui.tab === 'uebersicht') renderUebersicht(c);
    else renderVerwalten(c);
  } else {
    ui.screen = 'home';
    $('#title').textContent = 'HA-Liste';
    $('#back').hidden = true;
    $('#tabs').hidden = true;
    renderHome();
  }
}

/* ---------- Start: Klassenwahl ---------- */
function renderHome() {
  let h = '';
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!standalone) h += `<div class="note"><span>Für Offline-Nutzung und dauerhafte Speicherung: in Safari <b>Teilen → Zum Home-Bildschirm</b> und die App von dort starten.</span></div>`;
  if (S.classes.length) {
    const days = S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 864e5) : null;
    if (days === null || days >= 14) h += `<div class="note"><span>Letzte Sicherung: <b>${days === null ? 'noch nie' : 'vor ' + days + ' Tagen'}</b>. Die Daten liegen nur auf diesem Gerät.</span><button class="btn small" data-act="backup">Jetzt sichern</button></div>`;
    h += `<h2>Klasse wählen</h2><div class="cards">` + S.classes.slice().sort(byName).map(c =>
      `<button class="card" data-act="openClass" data-cid="${c.id}"><span class="cname">${esc(c.name)}</span><span class="cmeta">${c.students.length} Schüler · ${c.subjects.map(esc).join(', ')}</span></button>`).join('') + `</div>`;
  } else {
    h += `<div class="empty">Noch keine Klassen angelegt.</div>`;
  }
  h += `<button class="btn primary wide" data-act="addClass">+ Klasse anlegen</button>`;
  main.innerHTML = h;
}

/* ---------- Sitzplan-Hilfen ---------- */
function seatOrder(c) {
  const R = [...Array(c.seats.rows).keys()], C = [...Array(c.seats.cols).keys()];
  // Standard: Pult unten (Blick der Lehrkraft), Reihe 0 = vorne. flip: Pult oben.
  return c.seats.flip ? { rows: R, cols: C.slice().reverse() } : { rows: R.slice().reverse(), cols: C };
}
function seatKeyOf(c, sid) { for (const k in c.seats.map) if (c.seats.map[k] === sid) return k; return null; }
function seatGrid(c, cell) {
  const o = seatOrder(c);
  const pult = `<div class="pult">Tafel / Pult</div>`;
  let g = `<div class="scrollx"><div class="seats" style="--cols:${c.seats.cols}">`;
  o.rows.forEach(r => o.cols.forEach(col => { g += cell(r + ',' + col, c.seats.map[r + ',' + col]); }));
  g += `</div></div>`;
  return c.seats.flip ? pult + g : g + pult;
}

/* ---------- Erfassen ---------- */
function totalsFor(c, subj, catId) {
  const t = {}; const E = S.entries[c.id] || {};
  for (const k in E) { if (k.slice(11) !== subj) continue; for (const sid in E[k]) if (E[k][sid].includes(catId)) t[sid] = (t[sid] || 0) + 1; }
  return t;
}
function tile(st, day, cat, tot, seat) {
  const arr = day[st.id] || [];
  const on = arr.includes(cat.id);
  const tags = arr.map(catById).filter(Boolean).map(k => `<span class="pill" style="--c:${k.color}">${esc(k.name)}</span>`).join('');
  return `<button class="stu ${on ? 'on' : ''}" style="--c:${cat.color}" data-act="toggle" data-sid="${st.id}"><span class="sn">${esc(seat ? shortName(st.name) : st.name)}</span><span class="tags">${tags}</span>${tot[st.id] ? `<span class="tot">${tot[st.id]}</span>` : ''}</button>`;
}
function btile(st, dayB, day, avgs, seat) {
  const v = dayB[st.id] || 0;
  const tags = (day[st.id] || []).map(catById).filter(Boolean).map(k => `<span class="pill" style="--c:${k.color}">${esc(k.name)}</span>`).join('');
  return `<div class="stu bt ${v ? 'on' : ''}" style="--c:var(--pri)"><span class="sn">${esc(seat ? shortName(st.name) : st.name)}</span>`
    + `<span class="stars">${[1, 2, 3, 4, 5].map(n => `<button class="star ${n <= v ? 'on' : ''}" data-act="star" data-sid="${st.id}" data-n="${n}" aria-label="${n} Sterne">★</button>`).join('')}</span>`
    + (tags ? `<span class="tags">${tags}</span>` : '') + (avgs[st.id] ? `<span class="tot">Ø ${avgs[st.id]}</span>` : '') + `</div>`;
}
function bstats(c, subj, from) {
  const res = {};
  c.students.forEach(s => res[s.id] = { sum: 0, n: 0, list: [] });
  const B = S.beitr[c.id] || {};
  for (const k in B) {
    const d = k.slice(0, 10), sj = k.slice(11);
    if (subj !== '*' && sj !== subj) continue;
    if (from && d < from) continue;

async function shareOrDownload(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}

      <div class="field"><label>Gelb ab … Punkten</label><input type="number" inputmode="decimal" min="0.5" step="0.5" value="${s.gelb}" data-dchg="gelb"></div>
      <div class="field"><label>Rot ab … Punkten</label><input type="number" inputmode="decimal" min="0.5" step="0.5" value="${s.rot}" data-dchg="rot"></div>
    </div>
    <h4>Notenschlüssel Unterrichtsbeiträge</h4>
    <p class="muted" style="margin:0 0 8px">Ab welchem Sterne-Durchschnitt (1–5) gibt es welche Note? Werte gehen von Note 1 nach unten.</p>
    <table class="keytab"><thead><tr><th>Note</th>${Object.values(NIV).map(l => `<th class="n">${l} ab Ø</th>`).join('')}</tr></thead><tbody>
      ${[0, 1, 2, 3, 4].map(i => `<tr><td><b>${i + 1}</b></td>${Object.keys(NIV).map(sys => `<td class="n"><input type="number" inputmode="decimal" min="1" max="5" step="0.1" value="${S.scales[sys][i]}" data-dchg="scale" data-sys="${sys}" data-g="${i}" aria-label="${NIV[sys]} Note ${i + 1}"></td>`).join('')}</tr>`).join('')}
      <tr><td><b>6</b></td><td class="n muted" colspan="2">darunter</td></tr>
    </tbody></table>
    <div class="actions" style="justify-content:flex-start"><button class="btn small" data-dact="resetScale">Vorschlag wiederherstellen</button></div>
    <h4>Datensicherung</h4>
    <p class="muted" style="margin-top:0">Alle Daten liegen nur auf diesem Gerät. Wird die App vom Home-Bildschirm gelöscht, sind auch die Daten weg. Letzte Sicherung: ${S.lastBackup ? new Date(S.lastBackup).toLocaleDateString('de-DE') : 'noch nie'}.</p>
    <div class="actions" style="justify-content:flex-start"><button class="btn" data-dact="backup">Sicherung exportieren</button><button class="btn" data-dact="import">Sicherung importieren</button></div>
    <div class="actions" style="margin-top:20px"><button class="btn primary" data-close>Fertig</button></div>`);
}
dlg.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { dlg.close(); return; }
  const b = e.target.closest('[data-dact]'); if (!b) return;
  const i = +b.dataset.i, k = S.cats[i];
  switch (b.dataset.dact) {
    case 'color': k.color = COLORS[(COLORS.indexOf(k.color) + 1) % COLORS.length]; break;
    case 'up': [S.cats[i - 1], S.cats[i]] = [S.cats[i], S.cats[i - 1]]; break;
    case 'delcat': {
      const n = countCatUse(k.id);
      if (!confirm(`Kategorie „${k.name}“ löschen?${n ? ` Dabei werden ${n} Einträge entfernt.` : ''}`)) return;
      for (const cid in S.entries) for (const key in S.entries[cid]) {
        const day = S.entries[cid][key];
        for (const sid in day) { day[sid] = day[sid].filter(x => x !== k.id); if (!day[sid].length) delete day[sid]; }
        if (!Object.keys(day).length) delete S.entries[cid][key];
      }
      S.cats.splice(i, 1);
      if (ui.ovCat === k.id) ui.ovCat = '*';
      break;
    }
    case 'addcat': {
      const name = dlg.querySelector('#newCat').value.trim();
      if (!name) { dlg.querySelector('#newCat').focus(); return; }
      const used = new Set(S.cats.map(x => x.color));
      const id = uid();
      S.cats.push({ id, name, color: COLORS.find(c => !used.has(c)) || COLORS[S.cats.length % COLORS.length], w: 1, grp: id });
      break;
    }
    case 'resetScale': if (!confirm('Notenschlüssel auf den Vorschlag zurücksetzen?')) return; S.scales = defaultScales(); break;
    case 'backup': backup(); return;
    case 'import': $('#importFile').click(); return;
  }
  save(); renderSettings();
});
dlg.addEventListener('change', e => {
  const t = e.target, f = t.dataset.dchg; if (!f) return;
  const k = S.cats[+t.dataset.i];
  if (f === 'scale') {
    const t2 = S.scales[t.dataset.sys], i = +t.dataset.g, v = Math.round(parseFloat(String(t.value).replace(',', '.')) * 100) / 100;
    if (!(v >= 1 && v <= 5) || (i > 0 && v > t2[i - 1]) || (i < 4 && v < t2[i + 1])) { toast('Wert muss zwischen den Nachbarnoten liegen (1–5)'); t.value = t2[i]; return; }
    t2[i] = v; save(); toast('Gespeichert'); return;
  }
  if (f === 'name') { const v = t.value.trim(); if (v) k.name = v; else t.value = k.name; }
  else if (f === 'w') k.w = parseFloat(t.value);
  else if (f === 'gelb' || f === 'rot') {
    const v = parseFloat(t.value), g = f === 'gelb' ? v : S.settings.gelb, r = f === 'rot' ? v : S.settings.rot;
    if (!(v > 0) || r < g) { toast('Rot muss mindestens so hoch wie Gelb sein'); t.value = S.settings[f]; return; }
    S.settings[f] = v;
  }
  save(); toast('Gespeichert');
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result); const n = normalize(j.data || j);
      if (!n) throw 0;
      if (!confirm(`Sicherung mit ${n.classes.length} Klasse(n) importieren? Die aktuellen Daten auf diesem Gerät werden ersetzt.`)) return;
      S = n; save(); ui.screen = 'home';
      if (dlg.open) dlg.close(); else render();
      toast('Sicherung importiert');
    } catch (err) { alert('Diese Datei ist keine gültige HA-Liste-Sicherung.'); }
  };
  rd.readAsText(f);
});

/* ---------- Aktionen ---------- */
const acts = {
  openClass(b) { Object.assign(ui, { screen: 'class', cid: b.dataset.cid, tab: 'erfassen', date: today(), subj: null, detail: null, pick: null }); render(); scrollTo(0, 0); },
  addClass: () => classDialog(),
  backup: () => backup(),
  tab(b) { ui.tab = b.dataset.tab; ui.pick = null; render(); scrollTo(0, 0); },
  day(b) { ui.date = shiftDay(ui.date, +b.dataset.d); render(); },
  cat(b) { ui.cat = b.dataset.id; render(); },
  view(b) { cls().view = b.dataset.v; save(); render(); },
  toggle(b) {
    const c = cls(), subj = curSubj(c), cat = curCat(), k = ui.date + '|' + subj;
    const E = S.entries[c.id] || (S.entries[c.id] = {});
    const day = E[k] || (E[k] = {});
    const sid = b.dataset.sid;
    let arr = day[sid] || [];
    if (arr.includes(cat.id)) arr = arr.filter(x => x !== cat.id);
    else { arr = arr.filter(x => { const o = catById(x); return !o || o.grp !== cat.grp; }); arr.push(cat.id); }
    if (arr.length) day[sid] = arr; else delete day[sid];
    if (!Object.keys(day).length) delete E[k];
    save(); render();
  },
  star(b) {
    const c = cls(), k = ui.date + '|' + curSubj(c), n = +b.dataset.n, sid = b.dataset.sid;
    const B = S.beitr[c.id] || (S.beitr[c.id] = {});
    const day = B[k] || (B[k] = {});
    if (day[sid] === n) delete day[sid]; else day[sid] = n;
    if (!Object.keys(day).length) delete B[k];
    save(); render();
  },
  fillRest(b) {
    const c = cls(), k = ui.date + '|' + curSubj(c), n = +b.dataset.n;
    const B = S.beitr[c.id] || (S.beitr[c.id] = {});
    const day = B[k] || (B[k] = {});
    let m = 0; c.students.forEach(s => { if (!day[s.id]) { day[s.id] = n; m++; } });
    save(); render(); toast(`${m} Schüler mit ${n} ★ bewertet`);
  },
  niv(b) {
    const c = cls(), s = c.students.find(x => x.id === b.dataset.sid);
    const next = effNiv(c, s) === 'msa' ? 'ue' : 'msa';
    if (next === c.niveau) delete s.niv; else s.niv = next;
    save(); render();
  },
  ovMode(b) { ui.ovMode = b.dataset.m; ui.detail = null; render(); },
  csvBeitr() {
    const c = cls(), from = rangeFrom(ui.ovRange), st = bstats(c, ui.ovSubj, from);
    const rows = [['Klasse', 'Name', 'Niveau', 'Fach', 'Zeitraum ab', 'Anzahl Bewertungen', 'Durchschnitt Sterne', 'Note']];
    c.students.forEach(s => { const r = st[s.id], niv = effNiv(c, s); rows.push([c.name, s.name, NIV[niv], ui.ovSubj === '*' ? 'alle' : ui.ovSubj, from ? fmt(from) : 'gesamt', r.n, r.n ? avgFmt(r.avg) : '', r.n ? grade(r.avg, niv) : '']); });
    shareOrDownload(`Beitraege_${safe(c.name)}_${today()}.csv`, csv(rows), 'text/csv');
  },
  detail(b) { ui.detail = ui.detail === b.dataset.sid ? null : b.dataset.sid; render(); },
  pick(b) { ui.pick = ui.pick === b.dataset.sid ? null : b.dataset.sid; render(); },
  seatCell(b) {
    const c = cls(), key = b.dataset.k, occ = c.seats.map[key];
    if (!ui.pick) { if (occ) ui.pick = occ; render(); return; }
    if (occ === ui.pick) { ui.pick = null; render(); return; }
    const from = seatKeyOf(c, ui.pick);
    if (from) delete c.seats.map[from];
    if (occ && from) c.seats.map[from] = occ;
    c.seats.map[key] = ui.pick;
    ui.pick = null; save(); render();
  },
  seatUnseat() { const c = cls(), k = seatKeyOf(c, ui.pick); if (k) delete c.seats.map[k]; ui.pick = null; save(); render(); },
  seatAuto() {
    const c = cls(), seated = new Set(Object.values(c.seats.map));
    const rest = c.students.filter(s => !seated.has(s.id));
    for (let r = 0; r < c.seats.rows && rest.length; r++)
      for (let col = 0; col < c.seats.cols && rest.length; col++)
        if (!c.seats.map[r + ',' + col]) c.seats.map[r + ',' + col] = rest.shift().id;
    if (rest.length) toast(`${rest.length} Schüler passen nicht mehr – mehr Plätze anlegen`);
    ui.pick = null; save(); render();
  },
  seatClear() { if (!confirm('Alle Sitzplätze dieser Klasse freigeben?')) return; cls().seats.map = {}; ui.pick = null; save(); render(); },
  csvOverview() {
    const c = cls(), from = rangeFrom(ui.ovRange), cats = shownCats(), st = stats(c, ui.ovSubj, from, cats);
    const rows = [['Klasse', 'Name', 'Fach', 'Zeitraum ab', ...cats.map(k => k.name), 'Punkte', 'Ampel']];
    c.students.slice().sort(byName).forEach(s => { const r = st[s.id]; rows.push([c.name, s.name, ui.ovSubj === '*' ? 'alle' : ui.ovSubj, from ? fmt(from) : 'gesamt', ...cats.map(k => r.n[k.id] || 0), num(r.p), { g: 'grün', y: 'gelb', r: 'rot' }[ampel(r.p)]]); });
    shareOrDownload(`HA_${safe(c.name)}_Uebersicht_${today()}.csv`, csv(rows), 'text/csv');
  },
  csvRaw() {
    const c = cls(), E = S.entries[c.id] || {}, names = Object.fromEntries(c.students.map(s => [s.id, s.name]));
    const rows = [];
    for (const k in E) for (const sid in E[k]) if (names[sid]) E[k][sid].forEach(cid => { const cat = catById(cid); if (cat) rows.push([k.slice(0, 10), k.slice(11), names[sid], cat.name]); });
    rows.sort((a, b) => a[0].localeCompare(b[0]) || a[1].localeCompare(b[1]) || a[2].localeCompare(b[2], 'de'));
    shareOrDownload(`HA_${safe(c.name)}_Eintraege_${today()}.csv`, csv([['Datum', 'Fach', 'Name', 'Kategorie'], ...rows.map(r => [fmt(r[0]), r[1], r[2], r[3]])]), 'text/csv');
  },
  saveMeta() {
    const c = cls(), name = $('#vName').value.trim(), subs = parseSubjects($('#vSubj').value);
    if (!name || !subs.length) { toast('Name und mind. ein Fach angeben'); return; }
    const removed = c.subjects.filter(s => !subs.includes(s));
    const E = S.entries[c.id] || {};
    const lost = removed.filter(s => Object.keys(E).some(k => k.slice(11) === s));
    if (lost.length && !confirm(`Für ${lost.join(', ')} gibt es Einträge. Sie bleiben gespeichert, werden aber nicht mehr angezeigt, solange das Fach fehlt. Fortfahren?`)) return;
    c.name = name; c.subjects = subs; save(); toast('Gespeichert'); render();
  },
  addStu() { const c = cls(), n = addStudents(c, $('#vAdd').value); save(); toast(n ? `${n} Schüler hinzugefügt` : 'Keine neuen Namen'); render(); },
  renStu(b) {
    const c = cls(), s = c.students.find(x => x.id === b.dataset.sid);
    const n = prompt('Name ändern:', s.name);
    if (n && n.trim()) { s.name = n.trim(); c.students.sort(byName); save(); render(); }
  },
  delStu(b) {
    const c = cls(), s = c.students.find(x => x.id === b.dataset.sid);
    if (!confirm(`${s.name} mit allen Einträgen entfernen?`)) return;
    c.students = c.students.filter(x => x.id !== s.id);
    const k = seatKeyOf(c, s.id); if (k) delete c.seats.map[k];
    if (ui.pick === s.id) ui.pick = null;
    [S.entries[c.id] || {}, S.beitr[c.id] || {}].forEach(E => {
      for (const key in E) { delete E[key][s.id]; if (!Object.keys(E[key]).length) delete E[key]; }
    });
    save(); render();
  },
  delClass() {
    const c = cls();
    if (!confirm(`Klasse ${c.name} mit allen Einträgen endgültig löschen?`)) return;
    S.classes = S.classes.filter(x => x.id !== c.id); delete S.entries[c.id]; delete S.beitr[c.id];
    save(); ui.screen = 'home'; render();
  }
};
const chg = {
  date(t) { ui.date = t.value || today(); render(); },
  subj(t) {
    const c = cls();
    if (t.value === '__new') {
      const n = prompt('Neues Fach:');
      const s = n && parseSubjects(n)[0];
      if (s && !c.subjects.includes(s)) c.subjects.push(s);
      if (s) { ui.subj = s; c.lastSubj = s; }
      save(); render(); return;
    }
    ui.subj = t.value; c.lastSubj = t.value; save(); render();
  },
  ovSubj(t) { ui.ovSubj = t.value; ui.detail = null; render(); },
  ovCat(t) { ui.ovCat = t.value; render(); },
  ovRange(t) { ui.ovRange = t.value; render(); },
  seatRows(t) { const c = cls(); resizeSeats(c, +t.value, c.seats.cols); },
  seatCols(t) { const c = cls(); resizeSeats(c, c.seats.rows, +t.value); },
  classNiv(t) { const c = cls(); c.niveau = t.value; c.students.forEach(s => { if (s.niv === c.niveau) delete s.niv; }); save(); render(); },
  seatFlip(t) { cls().seats.flip = t.checked; save(); render(); }
};
main.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && acts[b.dataset.act]) acts[b.dataset.act](b, e); });
main.addEventListener('change', e => { const t = e.target; if (t.dataset.chg && chg[t.dataset.chg]) chg[t.dataset.chg](t); });
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) acts.tab(b); });
$('#back').onclick = () => { ui.screen = 'home'; ui.pick = null; render(); scrollTo(0, 0); };
$('#menu').onclick = renderSettings;
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => { });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) location.reload(); });
}
</script>
</body>
